services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  solr:
    image: solr:9.6
    restart: unless-stopped
    command: solr-precreate eduaxis
    volumes:
      - solr-data:/var/solr

  backend:
    build:
      context: ./Backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      solr:
        condition: service_started
    ports:
      - "5001:5000"
    env_file:
      - ./Backend/.env
    environment:
      PORT: 5000
      NODE_ENV: production
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5000,http://127.0.0.1:5000
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      SOLR_ENABLED: "true"
      SOLR_PROTOCOL: http
      SOLR_HOST: solr
      SOLR_PORT: 8983
      SOLR_CORE: eduaxis
    volumes:
      - ./Backend/uploads:/app/uploads
      - ./Backend/logs:/app/logs

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5001/api
        VITE_SOCKET_URL: http://localhost:5001
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  redis-data:
  solr-data: